[project]
name = "stickdrift"
version = "0.1.0"
description = "Stick Drift games and DualSense input tools"
readme = "README.md"
authors = [
    { name = "Zain Rizvi", email = "zain4rizvi@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "hidapi>=0.15.0",
    "numpy>=2.5.4",
    "pygame-ce>=2.5.8",
    "torch>=2.14.1",
]

[tool.uv]
package = false

[dependency-groups]
study = [
    "matplotlib>=3.11.2",
    "scipy>=1.18.1",
]
