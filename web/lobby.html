<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stick Drift 3D Lobby</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
      canvas { display: block; width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="ui"></div>
    <div id="label"></div>
    <div id="signin" hidden>
      <div>
        <h2 id="signin-title">Log in as a resident to save this visit</h2>
        <p id="signin-text">Games are only saved, and shown to the care team, when a resident is logged in.</p>
        <p class="signin-actions">
          <a class="signin-go" href="/login">Resident log in</a>
          <button type="button" id="signin-skip">Play without saving</button>
        </p>
      </div>
    </div>
    <div id="exiting"><div><h2>Session ended</h2><p>Heading back to the dashboard…</p></div></div>
    <script type="module" src="/lobby/main.js"></script>
  </body>
</html>
